<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driftboard — Kanban Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◆</span>
        <div>
          <h1>Driftboard</h1>
          <p>Move work forward, one card at a time.</p>
        </div>
      </div>
      <button id="clearBoard" class="ghost-btn" type="button">Clear board</button>
    </header>

    <main class="board" id="board">

      <section class="column" data-status="todo">
        <div class="column-head" data-accent="todo">
          <h2>To-Do</h2>
          <span class="count" id="count-todo">0</span>
        </div>

        <form class="add-form" data-status="todo">
          <input type="text" placeholder="Add a task…" aria-label="New to-do task" required />
          <button type="submit" aria-label="Add task">+</button>
        </form>

        <div class="card-list" id="list-todo" data-status="todo"></div>
      </section>

      <section class="column" data-status="doing">
        <div class="column-head" data-accent="doing">
          <h2>Doing</h2>
          <span class="count" id="count-doing">0</span>
        </div>

        <form class="add-form" data-status="doing">
          <input type="text" placeholder="Add a task…" aria-label="New doing task" required />
          <button type="submit" aria-label="Add task">+</button>
        </form>

        <div class="card-list" id="list-doing" data-status="doing"></div>
      </section>

      <section class="column" data-status="done">
        <div class="column-head" data-accent="done">
          <h2>Done</h2>
          <span class="count" id="count-done">0</span>
        </div>

        <form class="add-form" data-status="done">
          <input type="text" placeholder="Add a task…" aria-label="New done task" required />
          <button type="submit" aria-label="Add task">+</button>
        </form>

        <div class="card-list" id="list-done" data-status="done"></div>
      </section>

    </main>

    <footer class="page-footer">
      Built for the Syntecxhub Internship — Front-End Track
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
